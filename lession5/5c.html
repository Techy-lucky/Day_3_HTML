<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            font-family: Verdana;
            margin-top: 0px;
            margin-bottom: 0px;
        }
        .class1{
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .class2{
            color: rgb(96,96,96);
            margin-bottom: 20px;
        }
        .class3{
            width: 280px;
            margin-bottom: 15px;
        }
        .class4{
            background-color: green;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;

        }
    </style>
</head>
<body>
    <p class="class1">HTML CSS Course</p>
    <p class="class2">Beginner to Pro</p>
    <p class="class3">In this course, we'll learn the skills you need to become a developer.</p>
    <button class="class4">Get Started</button>
</body>
</html>
