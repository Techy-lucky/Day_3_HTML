<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: arial;
            text-align: center;
        }
        p{
            margin-top: 0px;
            margin-bottom: 0px;
        }
        .class1{
            font-size: 13px;
            color: red;
            margin-bottom: 6px;
        }
        .class2{
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .class3{
            font-size: 35px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .class4{
            margin-bottom: 8px;
            font-size: 15px;
        }
        .class5{
            background-color: rgb(0, 123, 255);
            padding: 5px 10px;
            border-radius: 20px;
            color: white;
            border: none;
        }
    </style>
</head>
<body>
    <p class="class1">New</p>
    <p class="class2">MacBook Pro</p>
    <p class="class3">Supercharged for pros</p>
    <p class="class4">from $1999</p>
    <button class="class5">Buy</button>
    
</body>
</html>
